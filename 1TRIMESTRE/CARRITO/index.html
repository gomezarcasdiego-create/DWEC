<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>agoodshop - Carrito</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar bg-body-tertiary">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">agoodshop</span>
        </div>
    </nav>

    <div id="contenedor">
        <div id="contenedorTabla">
            <table class="carrito-table">
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Cantidad</th>
                        <th>Unidad</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody id="carrito"></tbody>
            </table>
        </div>

        <div id="Carritototal">
            <h2>Total</h2>
            <ul id="resumen"></ul>
            <div class="total-final">
                <span>TOTAL</span>
                <strong id="precioTotal">0€</strong>
            </div>
        </div>
    </div>

    <!-- Primero la lógica, después la interfaz -->
    <script src="carrito.js"></script>
    <script src="app.js"></script>
</body>

</html>
